choir:
  auth:
    registration:
      enabled: false
    verification-url-base:

spring:
  application:
    name: choir-platform
  profiles:
    default: local
  flyway:
    enabled: true
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:choir;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    locations: classpath:db/migration

server:
  reactive:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    locations: classpath:db/migration

server:
  reactive:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: true

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Repeat deterministic CHOIR-43 test (H2)
        run: |
          for attempt in 1 2 3; do
            echo "CHOIR-43 H2 attempt ${attempt}/3"
            ./gradlew test --tests 'com.rubengarcia.choir.auth.DirectorRegistrationCompletedLookupConcurrentTests'
          done

      - name: Run full test suite with local profile
        run: ./gradlew test

  test-prod:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        command: ["postgres", "-c", "max_connections=200"]
        env:
          POSTGRES_DB: choir
          POSTGRES_USER: choir
          POSTGRES_PASSWORD: choir
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U choir -d choir"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://localhost:5432/choir
      R2DBC_URL: r2dbc:postgresql://localhost:5432/choir
      DATABASE_USERNAME: choir
      DATABASE_PASSWORD: choir
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Repeat deterministic CHOIR-43 test (PostgreSQL)
        run: |
          for attempt in 1 2 3; do
            echo "CHOIR-43 PostgreSQL attempt ${attempt}/3"
            ./gradlew test --tests 'com.rubengarcia.choir.auth.DirectorRegistrationCompletedLookupConcurrentTests'
          done

      - name: Run full test suite with production profile and PostgreSQL
        run: ./gradlew test

      - name: Validate CHOIR-56 rollback script on PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

          # Preparar una base aislada con el esquema hasta V11.
          # La base choir conserva todas las migraciones y sus restricciones.
          psql "postgresql://choir:choir@localhost:5432/choir" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE choir_rollback"

          ROLLBACK_URL="postgresql://choir:choir@localhost:5432/choir_rollback"
          export ROLLBACK_URL

          for version in $(seq 1 11); do
            migration="$(find src/main/resources/db/migration \
              -maxdepth 1 -type f \
              -name "V${version}__*.sql" -print -quit)"

            if [ -z "$migration" ]; then
              echo "ERROR: falta la migración V${version}"
              exit 1
            fi

            echo "Aplicando ${migration} a la base de rollback"
            psql "$ROLLBACK_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

          # Ejecutar el rollback únicamente sobre el esquema V1-V11.
          psql "$ROLLBACK_URL" -v ON_ERROR_STOP=1 \
            -f docs/migrations/rollback-CHOIR-56.sql

          # Verificar que se eliminaron las estructuras vocales previstas
          # y que las tablas preexistentes siguen disponibles.
          psql "$ROLLBACK_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.vocal_sections') IS NOT NULL
               OR to_regclass('public.vocal_plans') IS NOT NULL
               OR to_regclass('public.vocal_plan_divisions') IS NOT NULL
               OR to_regclass('public.concert_vocal_adjustments') IS NOT NULL
               OR to_regclass('public.concert_vocal_assignments') IS NOT NULL
               OR to_regclass('public.concert_vocal_assignment_snapshots') IS NOT NULL
               OR to_regclass('public.work_vocal_assignments') IS NOT NULL
               OR EXISTS (
                 SELECT 1 FROM information_schema.columns
                 WHERE table_schema = 'public'
                   AND table_name = 'singers'
                   AND column_name = 'voice_section_id'
               )
               OR EXISTS (
                 SELECT 1 FROM information_schema.columns
                 WHERE table_schema = 'public'
                   AND table_name = 'concert_cast_snapshots'
                   AND column_name = 'division_number_snapshot'
               )
               OR EXISTS (
                 SELECT 1 FROM information_schema.columns
                 WHERE table_schema = 'public'
                   AND table_name = 'formation_positions'
                   AND column_name = 'division_number_snapshot'
               )
            THEN
              RAISE EXCEPTION 'CHOIR-56 rollback dejó estructuras vocales instaladas';
            END IF;

            IF to_regclass('public.choirs') IS NULL
               OR to_regclass('public.singers') IS NULL
            THEN
              RAISE EXCEPTION 'CHOIR-56 rollback eliminó tablas preexistentes';
            END IF;
          END
          $$;
          SQL

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests with local profile
        run: ./gradlew test

  test-prod:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: choir
          POSTGRES_USER: choir
          POSTGRES_PASSWORD: choir
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U choir -d choir"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://localhost:5432/choir
      DATABASE_USERNAME: choir
      DATABASE_PASSWORD: choir
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests with production profile and PostgreSQL
        run: ./gradlew test
